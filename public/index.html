<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD2PDF | Markdown to PDF Converter</title>

    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for better typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&family=Fira+Code&display=swap"
      rel="stylesheet"
    />

    <!-- marked.js for client-side live preview -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Custom styles for themes -->
    <link rel="stylesheet" href="/css/styles.css" />

  </head>
  <body class="bg-gray-900 text-gray-200 flex flex-col min-h-screen">
    <div class="container mx-auto p-4 md:p-2 flex-grow">
      <header class="text-center mb-8">
        <img
          src="imgs/logo.png"
          alt="MD2PDF Logo"
          class="mx-auto h-24 w-auto mb-4 mt-8"
        />
        <p class="text-lg text-gray-400 mt-2">
          Professional PDF Documents from Simple Markdown.
        </p>
      </header>

      <div
        class="bg-gray-800 border border-gray-700 rounded-lg shadow-lg p-4 mb-6 flex flex-wrap items-center justify-center gap-4"
      >
        <div>
          <label for="theme-selector" class="mr-2 font-medium text-gray-300"
            >Select a Theme:</label
          >
          <select
            id="theme-selector"
            class="bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2.5"
          >
            <option value="light" selected>Light</option>
            <option value="academic">Academic</option>
            <option value="swiss">Swiss</option>
            <option value="blueprint">Blueprint</option>
            <option value="forest">Forest</option>
            <option value="plum">Plum</option>
          </select>
        </div>
        <div class="flex items-center">
          <input
            id="page-break-toggle"
            type="checkbox"
            class="h-4 w-4 rounded border-gray-600 bg-gray-900 text-indigo-600 focus:ring-indigo-500"
            checked
          />
          <label
            for="page-break-toggle"
            class="ml-2 text-sm font-medium text-gray-300"
            >Show Page Breaks</label
          >
        </div>
        <button
          id="download-pdf-btn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-all duration-200 transform hover:scale-105 disabled:bg-indigo-400 disabled:cursor-not-allowed"
        >
          Download PDF
        </button>
      </div>

      <div
        id="error-box"
        class="hidden bg-red-900 border border-red-700 text-red-300 px-4 py-3 rounded-lg relative mb-6"
        role="alert"
      >
        <strong class="font-bold">Error!</strong>
        <span class="block sm:inline" id="error-message"></span>
      </div>

      <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="flex flex-col">
          <h2 class="text-xl font-semibold mb-2 text-gray-300">
            Markdown Input
          </h2>
          <textarea
            id="markdown-input"
            class="w-full h-full p-4 rounded-lg shadow-inner bg-gray-900 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none font-mono text-sm"
            placeholder="Type your markdown here..."
          ></textarea>
        </div>

        <div class="flex flex-col">
          <h2 class="text-xl font-semibold mb-2 text-gray-300">Live Preview</h2>
          <div
            id="preview-container"
            class="h-full overflow-y-auto rounded-lg shadow-inner border border-gray-700 bg-white transition-colors duration-300"
          >
            <div id="preview-output" class="p-8 preview-pane">
              <!-- Rendered HTML will appear here -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer
      class="text-center mt-8 p-6 bg-gray-900 border-t border-gray-700 text-sm"
    >
      <p class="text-gray-400">
        Copyright &copy; 2025
        <span class="text-violet-400 hover:text-indigo-300 transition-colors"
          >Ashter</span
        >
      </p>
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
